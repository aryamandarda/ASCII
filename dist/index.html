<!doctype html>
<html lang="en">
<head>
<base href="/projects/ASCII/nyc/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Times Square</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Times Square">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="experience">
  <canvas id="ambient" aria-hidden="true" width="120" height="80"></canvas>
  <div id="surface"><canvas id="art" role="img" aria-label="Animated ASCII Times Square"></canvas></div>
  <div class="veil" aria-hidden="true"></div>
  <button id="immerse" class="glass enter" disabled><span>Immerse</span></button>
  <span id="loading" role="status" aria-label="Loading artwork"></span>
  <button id="leave" class="glass icon" aria-label="Leave immersive view" title="Leave immersive view" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  <button id="controlsToggle" class="glass controls-toggle" aria-controls="controls" aria-expanded="true" aria-label="Hide controls" hidden>Hide controls</button>
  <div id="likeWidget" class="like-widget">
    <button id="like" class="glass like-button" aria-label="Like Times Square" aria-pressed="false" title="Like" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span id="likeCount">—</span></button>
    <span id="likeStatus" class="like-status" role="status" aria-live="polite"></span>
  </div>
  <p id="viewHint" class="view-hint" hidden></p>
  <section id="controls" class="glass controls" aria-label="Scene controls" hidden>
    <div id="weatherOptions" class="glass sky-options weather-options" role="group" aria-label="Weather options" hidden><button data-weather="natural" aria-pressed="true" title="Restore weather synced to the selected date and time"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>Natural</button><button data-weather="clear" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></svg>Clear</button><button data-weather="passing" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2M2 8h2m7-5-1 2M7 12a4 4 0 1 1 5-5M7 19h12a3 3 0 0 0 0-6 5 5 0 0 0-9-2 4 4 0 0 0-3 8"/></svg>Passing Clouds</button><button data-weather="overcast" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18h14a3 3 0 0 0 0-6 6 6 0 0 0-11-2 4 4 0 0 0-3 8"/></svg>Overcast</button><button data-weather="rain" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14h14a3 3 0 0 0 0-6 6 6 0 0 0-11-2 4 4 0 0 0-3 8M7 17l-1 3m6-3-1 3m6-3-1 3"/></svg>Rain</button><button data-weather="snow" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M3 7l18 10M3 17 21 7M9 4l3 3 3-3M9 20l3-3 3 3M3 10l4-1-1-4M18 19l-1-4 4-1M3 14l4 1-1 4M18 5l-1 4 4 1"/></svg>Snow</button></div><div id="skyOptions" class="glass sky-options" role="group" aria-label="Twilight palette" hidden><button data-sky="gold" aria-pressed="false"><i class="swatch gold"></i>Gold</button><button data-sky="coral" aria-pressed="true"><i class="swatch coral"></i>Coral</button><button data-sky="rose" aria-pressed="false"><i class="swatch rose"></i>Rose</button><button data-sky="violet" aria-pressed="false"><i class="swatch violet"></i>Violet</button></div><div class="clock-row">
      <label class="calendar-control"><span id="dateValue"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 10 3 3 3-3"/></svg><input id="date" type="date" aria-label="Calendar date in New York"></label>
      <button id="sky" class="icon sky-toggle" aria-label="Choose sunrise and sunset colors" aria-expanded="false" title="Twilight palette"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M6 14a6 6 0 0 1 12 0M12 3v2M4 7l2 2m14-2-2 2M5 21h14"/></svg></button><button id="weather" class="icon sky-toggle" aria-label="Choose weather" aria-controls="weatherOptions" aria-expanded="false" title="Weather: Natural"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18h14a3 3 0 0 0 0-6 6 6 0 0 0-11-2 4 4 0 0 0-3 8"/></svg></button><output id="timeValue" for="time"></output>
    </div>
    <input id="time" type="range" min="0" max="1439" step="1" aria-label="Time of day in New York">
    <div class="view-actions"><button id="viewFit" aria-pressed="false" hidden>Full scene</button><button id="viewFullscreen">Fullscreen</button></div>
    <div class="transport">
      <div class="speeds" role="group" aria-label="Animation speed"><button data-speed="0.5" aria-pressed="false" aria-label="Half speed">0.5×</button><button data-speed="1" aria-pressed="true" aria-label="Normal speed">1×</button><button data-speed="2" aria-pressed="false" aria-label="Double speed">2×</button><button data-speed="3" aria-pressed="false" aria-label="Triple speed">3×</button><button data-speed="5" aria-pressed="false" aria-label="Five times speed">5×</button></div>
      <div class="playback">
        <button id="reverse" class="icon" aria-pressed="false" aria-label="Reverse playback" title="Reverse playback"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 7-6 5 6 5V7Zm8 0-6 5 6 5V7Z"/></svg></button>
        <button id="play" class="icon primary" aria-label="Pause animation" title="Pause animation"><svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m9 5 10 7-10 7V5Z"/></svg></button>
      </div>
    </div>
  </section>
</main>
<script src="vendor/suncalc.js"></script>
<script src="calendar.js"></script>
<script src="billboard-model.js"></script>
<script src="ad-director.js"></script>
<script src="character-grid.js"></script>
<script src="motion-manifest.js"></script>
<script src="pedestrian-rig.js"></script>
<script src="city-life.js"></script>
<script src="traffic.js"></script>
<script src="weather.js"></script>
<script src="environment.js"></script>
<script src="scene-view.js"></script>
<script src="fixed-screens.js"></script>
<script src="likes.js"></script>
</body>
</html>

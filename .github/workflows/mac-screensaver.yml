name: Mac screensaver preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/mac-screensaver.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package and compile both Mac architectures
        run: bash macos/build.sh
      - name: Compile native smoke-test host
        run: xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Werror macos/SmokeTest.m -framework Cocoa -framework WebKit -framework ScreenSaver -o build/macos/smoke-test
      - name: Verify offline animation and lifecycle in WebKit
        run: build/macos/smoke-test "$PWD/build/macos/Times Square.saver"
      - name: Attach install instructions and checksums
        run: |
          cd build/macos
          shasum -a 256 Times-Square-Mac-screensaver.zip > SHA256SUMS.txt
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mac-screensaver-${GITHUB_RUN_NUMBER}" \
            build/macos/Times-Square-Mac-screensaver.zip \
            build/macos/INSTALL.md build/macos/SHA256SUMS.txt build/macos/THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" --prerelease \
            --title "Times Square for Mac — preview" --notes-file macos/RELEASE_NOTES.md
